buildscript {
    repositories {
        mavenCentral()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
    }
}

allprojects {
    apply plugin: "eclipse"

    version = '1.0'
    ext {
        appName = "Pistolero vs Vampire"
        gdxVersion = '1.12.1'
        roboVMVersion = '2.3.19'
        box2DLightsVersion = '1.5'
        ashleyVersion = '1.7.4'
        aiVersion = '1.8.2'
        gdxControllersVersion = '2.2.1'
    }

    repositories {
        mavenCentral()
        google()
        gradlePluginPortal()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://oss.sonatype.org/content/repositories/releases/" }
        maven { url "https://jitpack.io" }
    }
}

project(":desktop") {
    apply plugin: "java-library"
    apply plugin: "application"

    application {
        mainClass = 'com.pistolero.desktop.DesktopLauncher'
    }

    sourceSets {
        main {
            java {
                srcDirs = ['src/']
            }
        }
    }

    dependencies {
        implementation project(":core")
        api "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    }

    // Configuration pour la tâche run
    tasks.named('run') {
        workingDir = rootProject.file('assets')
        ignoreExitValue = true

        // JVM optimizations
        jvmArgs = [
            '-Xms512m',
            '-Xmx1024m',
            '-XX:+UseG1GC'
        ]
    }

    // Configuration pour créer un JAR exécutable
    jar {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        dependsOn configurations.runtimeClasspath
        manifest {
            attributes 'Main-Class': 'com.pistolero.desktop.DesktopLauncher'
        }
        from {
            configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
        }
    }
}

project(":core") {
    apply plugin: "java-library"

    sourceSets {
        main {
            java {
                srcDirs = ['src/']
            }
        }
    }

    dependencies {
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
    }
}
